[domain_controller]
dc01.labhandzone.local

[sql_nodes]
sql01.labhandzone.local sql_server_fci_action=InstallFailoverCluster wsfc_is_cluster_creation_node=true iscsi_initialize_disks=true
sql02.labhandzone.local sql_server_fci_action=AddNode wsfc_is_cluster_creation_node=false iscsi_initialize_disks=false

[file_server]
fs01.labhandzone.local

[wsus]
wsus01.labhandzone.local

# Everything that needs to join the domain (dc01 does not — it CREATES the domain)
[fleet:children]
sql_nodes
file_server
wsus

[all:vars]
# Local Administrator over NTLM, throughout every phase — including after
# domain join, since the local Administrator account still exists and
# still authenticates. This avoids juggling different credentials/auth
# methods per phase. A hardened, non-lab setup would switch to a domain
# admin account + Kerberos after domain_join, and disable local
# Administrator per CIS baseline — same pattern as
# windows-fleet-monitoring's windows_baseline role, worth applying here
# too as a follow-up (see the root README's Roadmap).
ansible_connection=winrm
ansible_port=5986
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_user=Administrator
ansible_password="{{ vault_local_admin_password }}"
