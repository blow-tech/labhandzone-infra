---
# ansible/inventory/group_vars/all.yml
# Real values below are placeholders — vault every CHANGE_ME_* before a
# real run:
#   ansible-vault encrypt_string 'RealPassword123!' --name 'vault_local_admin_password'

vault_local_admin_password: "CHANGE_ME_VIA_ANSIBLE_VAULT"

ad_domain_name: "labhandzone.local"
ad_domain_netbios_name: "LABHANDZONE"
ad_safe_mode_password: "CHANGE_ME_VIA_ANSIBLE_VAULT"

domain_join_domain_name: "{{ ad_domain_name }}"
domain_join_admin_user: "LABHANDZONE\\Administrator"
domain_join_admin_password: "{{ vault_local_admin_password }}"

gpo_patching_domain_dn: "DC=labhandzone,DC=local"
gpo_patching_wsus_url: "http://wsus01.labhandzone.local:8530"
