---
# ansible/inventory/group_vars/sql_nodes.yml
domain_join_ou_path: "OU=SQLServers,OU=Servers,DC=labhandzone,DC=local"

# --- iscsi_initiator ---
iscsi_target_portal_ip: "10.10.10.30"   # fs01's IP — must match terraform.tfvars vm_ips.fs01
iscsi_target_name: "labhandzone-cluster"

# --- windows_failover_cluster ---
wsfc_cluster_name: "sqlcluster01"
wsfc_cluster_ip: "10.10.10.23"          # a free IP on the same subnet — the WSFC cluster's own network name IP
wsfc_nodes:
  - "sql01"
  - "sql02"
wsfc_witness_share_path: "\\\\fs01\\Witness"

# --- sql_server_fci ---
sql_server_media_path: 'D:\SQLServerSetup'   # mount SQL Server media here before running this role
sql_server_fci_network_name: "SQLFCI01"
sql_server_fci_ip: "10.10.10.24"             # the SQL Server's own virtual IP — distinct from wsfc_cluster_ip above
sql_service_account: "LABHANDZONE\\svc_sqlengine"
sql_service_account_password: "CHANGE_ME_VIA_ANSIBLE_VAULT"
sql_agent_service_account: "LABHANDZONE\\svc_sqlagent"
sql_agent_service_account_password: "CHANGE_ME_VIA_ANSIBLE_VAULT"
sql_sysadmin_accounts: "LABHANDZONE\\Domain Admins"
