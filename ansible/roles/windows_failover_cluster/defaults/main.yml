---
windows_failover_cluster_wsfc_cluster_name: "sqlcluster01"
windows_failover_cluster_wsfc_cluster_ip: ""              # static IP for the cluster network name — set in group_vars/sql_nodes.yml
windows_failover_cluster_wsfc_nodes: []                   # e.g. ["sql01", "sql02"] — set in group_vars/sql_nodes.yml
windows_failover_cluster_wsfc_witness_share_path: ""      # e.g. \\fs01\Witness — set in group_vars/sql_nodes.yml
# Only run cluster-creation commands from one node — the others just need
# the Failover-Clustering feature installed.
windows_failover_cluster_wsfc_is_cluster_creation_node: false
