---
# tasks/main.yml — role: windows_failover_cluster
# Runs on both sql01 and sql02. Installs the Failover-Clustering feature on
# both nodes; cluster creation, disk import, and quorum configuration only
# run from the node flagged windows_failover_cluster_wsfc_is_cluster_creation_node: true (sql01, by
# convention in this project — see group_vars/sql_nodes.yml).

- name: Require reviewed cluster storage mapping
  ansible.builtin.assert:
    that:
      - wsfc_expected_disk_resources | default([]) | length > 0
    fail_msg: "Cluster disk import is a separate approved operation. Provide reviewed resource names."

- name: Install Failover Clustering feature
  ansible.windows.win_feature:
    name: Failover-Clustering
    include_management_tools: true
    state: present
  register: windows_failover_cluster_wsfc_feature

- name: Reboot if the feature install requires it
  ansible.windows.win_reboot:
  when: windows_failover_cluster_wsfc_feature.reboot_required

# --- Everything below only runs from the designated creation node ---

- name: Check whether the cluster already exists
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    if (Get-Cluster -Name '{{ windows_failover_cluster_wsfc_cluster_name }}' -ErrorAction SilentlyContinue) {
      Write-Output "exists"
    } else {
      Write-Output "absent"
    }
  register: windows_failover_cluster_cluster_check
  changed_when: false
  when: windows_failover_cluster_wsfc_is_cluster_creation_node | bool

- name: Create the Windows Failover Cluster (no storage yet — added next)
  ansible.windows.win_shell: >
    New-Cluster -Name '{{ windows_failover_cluster_wsfc_cluster_name }}' -Node {{ windows_failover_cluster_wsfc_nodes | join(',') }}
    -StaticAddress {{ windows_failover_cluster_wsfc_cluster_ip }} -NoStorage
  when:
    - windows_failover_cluster_wsfc_is_cluster_creation_node | bool
    - windows_failover_cluster_cluster_check.stdout | trim == "absent"

- name: Validate reviewed cluster disk resource names instead of importing all available disks
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      ClusterName: "{{ windows_failover_cluster_wsfc_cluster_name }}"
      ResourceNames: "{{ wsfc_expected_disk_resources }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$ClusterName,[string[]]$ResourceNames)
      $Ansible.Changed = $false
      foreach ($name in $ResourceNames) {
        $r = @(Get-ClusterResource -Cluster $ClusterName -Name $name -ErrorAction Stop)
        if ($r.Count -ne 1 -or $r[0].ResourceType -ne 'Physical Disk') { throw 'Reviewed disk resource missing; import only verified storage separately.' }
      }
  when: windows_failover_cluster_wsfc_is_cluster_creation_node | bool

- name: Configure quorum with a file share witness on fs01
  # Requires the witness share to already exist with correct permissions —
  # see role file_server, and the note in the root README about the
  # chicken-and-egg around the Cluster Name Object's permissions on that
  # share (CNO doesn't exist in AD until the New-Cluster step above runs).
  ansible.windows.win_shell: >
    Set-ClusterQuorum -Cluster '{{ windows_failover_cluster_wsfc_cluster_name }}'
    -FileShareWitness '{{ windows_failover_cluster_wsfc_witness_share_path }}'
  when: windows_failover_cluster_wsfc_is_cluster_creation_node | bool
  changed_when: true
