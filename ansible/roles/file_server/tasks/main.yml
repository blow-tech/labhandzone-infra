---
# tasks/main.yml — role: file_server
# Runs on fs01. Creates the WSFC file share witness (permissioned to
# "Domain Computers" — see the note below on why, not a security
# shortcut) and a general-purpose department file share, to round out the
# "looks like a real environment" goal beyond just the cluster plumbing.

- name: Install File Server role
  ansible.windows.win_feature:
    name: FS-FileServer
    include_management_tools: true
    state: present
  register: file_server_feature

- name: Reboot if the feature install requires it
  ansible.windows.win_reboot:
  when: file_server_feature.reboot_required

- name: Create witness share directory
  ansible.windows.win_file:
    path: "{{ file_server_witness_share_path }}"
    state: directory

- name: Grant Domain Computers modify rights on the witness share directory (NTFS)
  # Why "Domain Computers" and not the cluster's own computer account
  # (CNO): the CNO doesn't exist in AD until windows_failover_cluster's
  # New-Cluster task runs, which happens AFTER this role in the playbook —
  # classic ordering chicken-and-egg. Every domain-joined computer object
  # (including the future CNO) is automatically a member of Domain
  # Computers, so this avoids the ordering problem without granting
  # Everyone/Authenticated Users. For a hardened, non-lab setup: run a
  # follow-up task after cluster creation that replaces this grant with an
  # explicit ACE for "{{ wsfc_cluster_name }}$" specifically.
  ansible.windows.win_acl:
    path: "{{ file_server_witness_share_path }}"
    user: "LABHANDZONE\\Domain Computers"
    rights: Modify
    type: allow
    state: present

- name: Create the witness SMB share
  ansible.windows.win_share:
    name: "{{ file_server_witness_share_name }}"
    path: "{{ file_server_witness_share_path }}"
    full_access: "LABHANDZONE\\Domain Admins"
    change_access: "LABHANDZONE\\Domain Computers"
    state: present

- name: Create general-purpose data share directory
  ansible.windows.win_file:
    path: "{{ file_server_data_share_path }}"
    state: directory

- name: Grant configured groups modify rights on the data share directory (NTFS)
  ansible.windows.win_acl:
    path: "{{ file_server_data_share_path }}"
    user: "{{ item }}"
    rights: Modify
    type: allow
    state: present
  loop: "{{ file_server_data_share_access_groups }}"

- name: Create the general-purpose SMB share
  ansible.windows.win_share:
    name: "{{ file_server_data_share_name }}"
    path: "{{ file_server_data_share_path }}"
    full_access: "LABHANDZONE\\Domain Admins"
    change_access: "{{ file_server_data_share_access_groups | join(',') if file_server_data_share_access_groups | length > 0 else omit }}"
    state: present
