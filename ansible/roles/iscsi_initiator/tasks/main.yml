---
# tasks/main.yml — role: iscsi_initiator
# Runs on sql01 and sql02. Connects to fs01's iSCSI target so the quorum
# and data LUNs are visible as local disks — Windows Failover Clustering
# (role: windows_failover_cluster) takes it from there.

- name: Require reviewed storage prerequisites before host changes
  ansible.builtin.assert:
    that:
      - iscsi_target_iqn | default('') is match('^iqn\.')
      - iscsi_target_portal_ip | length > 0
      - iscsi_lun_manifest | default([]) | length == 2
    fail_msg: "Supply exact target IQN, portal and two immutable LUN mappings; pre-provision storage separately."

- name: Ensure Microsoft iSCSI Initiator service is running
  ansible.windows.win_service:
    name: MSiSCSI
    start_mode: auto
    state: started

- name: Add iSCSI target portal (fs01)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    if (-not (Get-IscsiTargetPortal -TargetPortalAddress '{{ iscsi_target_portal_ip }}' -ErrorAction SilentlyContinue)) {
      New-IscsiTargetPortal -TargetPortalAddress '{{ iscsi_target_portal_ip }}'
      Write-Output "added"
    } else {
      Write-Output "already present"
    }
  register: portal_result
  changed_when: "'added' in portal_result.stdout"

- name: Connect only the approved exact iSCSI target IQN
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      TargetIqn: "{{ iscsi_target_iqn }}"
      Portal: "{{ iscsi_target_portal_ip }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$TargetIqn,[string]$Portal)
      $Ansible.Changed = $false
      $targets = @(Get-IscsiTarget -ErrorAction Stop | Where-Object { $_.NodeAddress -ceq $TargetIqn })
      if ($targets.Count -ne 1) { throw 'Exact target IQN not uniquely discovered.' }
      if (-not $targets[0].IsConnected -and $PSCmdlet.ShouldProcess($TargetIqn,'Connect iSCSI')) {
        Connect-IscsiTarget -NodeAddress $TargetIqn -TargetPortalAddress $Portal -IsPersistent $true -ErrorAction Stop
        $Ansible.Changed = $true
      }

- name: Rescan disks so the newly connected LUNs appear
  ansible.windows.win_shell: Update-HostStorageCache
  changed_when: true

# Initializing/formatting shared LUNs must be a separately reviewed storage change.
- name: Validate explicitly mapped and already provisioned LUNs on the initialization node
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      ManifestJson: "{{ iscsi_lun_manifest | default([]) | to_json }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$ManifestJson)
      $Ansible.Changed = $false
      $entries = @(ConvertFrom-Json $ManifestJson)
      if ($entries.Count -ne 2) { throw 'Exactly two reviewed LUN mappings are required.' }
      $ids = @{}
      foreach ($e in $entries) {
        if (-not $e.UniqueId -or $ids.ContainsKey([string]$e.UniqueId)) { throw 'Invalid/duplicate LUN identity.' }
        $ids[[string]$e.UniqueId] = $true
        $disks = @(Get-Disk -ErrorAction Stop | Where-Object { $_.UniqueId -ceq $e.UniqueId })
        if ($disks.Count -ne 1 -or $disks[0].BusType -ne 'iSCSI' -or $disks[0].IsBoot -or $disks[0].IsSystem -or $disks[0].PartitionStyle -eq 'RAW' -or $disks[0].Size -ne [long]$e.SizeBytes) { throw 'Unexpected or unprovisioned LUN.' }
      }
  when: iscsi_initialize_disks | bool
