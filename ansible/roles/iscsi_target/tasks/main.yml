---
# tasks/main.yml — role: iscsi_target
# Runs on fs01. Turns two raw data disks (provisioned by Terraform — see
# terraform/vsphere/main.tf's fs01 module block, extra_disk_sizes_gb =
# [5, 100]) into iSCSI-served LUNs for the WSFC quorum and SQL FCI shared
# data, exposed only to the SQL cluster nodes' IPs.
#
# Storage provisioning is intentionally separate. This role validates a reviewed
# UniqueId/size/drive-letter manifest; it never initializes or formats disks.

- name: Validate pre-provisioned storage by immutable identity before changing this host
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      ManifestJson: "{{ iscsi_target_volume_manifest | default([]) | to_json }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$ManifestJson)
      $Ansible.Changed = $false
      $entries = ConvertFrom-Json -InputObject $ManifestJson
      $entries = @($entries)
      if ($entries.Count -ne 2) { throw 'Supply exactly two reviewed volume mappings.' }
      $seen = @{}
      foreach ($e in $entries) {
        if (-not $e.UniqueId -or $e.DriveLetter -notmatch '^[D-Z]$' -or $seen.ContainsKey([string]$e.UniqueId)) { throw 'Invalid or duplicate mapping.' }
        $seen[[string]$e.UniqueId] = $true
        $disks = @(Get-Disk -ErrorAction Stop | Where-Object { $_.UniqueId -ceq $e.UniqueId })
        if ($disks.Count -ne 1 -or $disks[0].IsBoot -or $disks[0].IsSystem -or $disks[0].PartitionStyle -eq 'RAW' -or $disks[0].IsOffline -or $disks[0].IsReadOnly) { throw 'Storage must be pre-provisioned, online and non-system.' }
        if ([long]$e.SizeBytes -le 0 -or $disks[0].Size -ne [long]$e.SizeBytes) { throw 'Disk capacity does not match approved manifest.' }
        $part = @(Get-Partition -DriveLetter $e.DriveLetter -ErrorAction Stop)
        if ($part.Count -ne 1 -or $part[0].DiskNumber -ne $disks[0].Number) { throw 'Drive letter maps to an unexpected disk.' }
        $vol = Get-Volume -DriveLetter $e.DriveLetter -ErrorAction Stop
        if ($vol.FileSystem -ne 'NTFS' -or $vol.HealthStatus -ne 'Healthy') { throw 'Expected healthy NTFS volume.' }
      }
  register: iscsi_target_storage_preflight

- name: Require role drive letters to match the reviewed manifest
  ansible.builtin.assert:
    that:
      - iscsi_target_volume_manifest | map(attribute='DriveLetter') | sort | list == [iscsi_target_iscsi_quorum_drive_letter, iscsi_target_iscsi_data_drive_letter] | sort
      - iscsi_target_iscsi_allowed_initiator_ips | length > 0
    fail_msg: "Provide exact reviewed disks, volume letters and initiator addresses."

- name: Install iSCSI Target Server role
  ansible.windows.win_feature:
    name: FS-iSCSITarget-Server
    include_management_tools: true
    state: present
  register: iscsi_target_feature

- name: Reboot if the feature install requires it
  ansible.windows.win_reboot:
  when: iscsi_target_feature.reboot_required

- name: Create iSCSI virtual disk directories
  ansible.windows.win_file:
    path: "{{ item }}:\\iSCSIVirtualDisks"
    state: directory
  loop:
    - "{{ iscsi_target_iscsi_quorum_drive_letter }}"
    - "{{ iscsi_target_iscsi_data_drive_letter }}"

- name: Create iSCSI virtual disk (quorum)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    if (-not (Get-IscsiVirtualDisk -Path '{{ iscsi_target_iscsi_quorum_drive_letter }}:\iSCSIVirtualDisks\quorum.vhdx' -ErrorAction SilentlyContinue)) {
      New-IscsiVirtualDisk -Path '{{ iscsi_target_iscsi_quorum_drive_letter }}:\iSCSIVirtualDisks\quorum.vhdx' -Size {{ (iscsi_target_iscsi_quorum_disk_size_gb | int - 1) }}GB
      Write-Output "created"
    } else {
      Write-Output "already exists"
    }
  register: iscsi_target_quorum_vdisk_result
  changed_when: "'created' in iscsi_target_quorum_vdisk_result.stdout"

- name: Create iSCSI virtual disk (SQL data)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    if (-not (Get-IscsiVirtualDisk -Path '{{ iscsi_target_iscsi_data_drive_letter }}:\iSCSIVirtualDisks\sqldata.vhdx' -ErrorAction SilentlyContinue)) {
      New-IscsiVirtualDisk -Path '{{ iscsi_target_iscsi_data_drive_letter }}:\iSCSIVirtualDisks\sqldata.vhdx' -Size {{ (iscsi_target_iscsi_data_disk_size_gb | int - 1) }}GB
      Write-Output "created"
    } else {
      Write-Output "already exists"
    }
  register: iscsi_target_data_vdisk_result
  changed_when: "'created' in iscsi_target_data_vdisk_result.stdout"

- name: Create iSCSI server target, scoped to the SQL cluster nodes only
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    if (-not (Get-IscsiServerTarget -TargetName '{{ iscsi_target_name }}' -ErrorAction SilentlyContinue)) {
      New-IscsiServerTarget -TargetName '{{ iscsi_target_name }}' `
        -InitiatorIds {{ iscsi_target_iscsi_allowed_initiator_ips | map('regex_replace', '^(.*)$', "'IPAddress:\1'") | join(',') }}
      Write-Output "created"
    } else {
      Write-Output "already exists"
    }
  register: iscsi_target_result
  changed_when: "'created' in iscsi_target_result.stdout"

- name: Map virtual disks to the iSCSI target
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $mapped = Get-IscsiVirtualDiskTargetMapping -TargetName '{{ iscsi_target_name }}' -ErrorAction SilentlyContinue
    if (-not ($mapped | Where-Object { $_.Path -eq '{{ item }}' })) {
      Add-IscsiVirtualDiskTargetMapping -TargetName '{{ iscsi_target_name }}' -Path '{{ item }}'
      Write-Output "mapped"
    } else {
      Write-Output "already mapped"
    }
  loop:
    - "{{ iscsi_target_iscsi_quorum_drive_letter }}:\\iSCSIVirtualDisks\\quorum.vhdx"
    - "{{ iscsi_target_iscsi_data_drive_letter }}:\\iSCSIVirtualDisks\\sqldata.vhdx"
  register: iscsi_target_mapping_result
  changed_when: "iscsi_target_mapping_result.stdout | trim == 'mapped'"
