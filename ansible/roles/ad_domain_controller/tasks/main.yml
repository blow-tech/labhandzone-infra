---
# tasks/main.yml — role: ad_domain_controller
# Runs on dc01 only. Promotes the first domain controller of a brand new
# forest (labhandzone.local), then lays down the base OU structure that
# domain_join and gpo_patching build on.

- name: Promote dc01 to the first domain controller of a new forest
  microsoft.ad.domain:
    dns_domain_name: "{{ ad_domain_name }}"
    domain_netbios_name: "{{ ad_domain_netbios_name }}"
    safe_mode_password: "{{ ad_safe_mode_password }}"
    install_dns: true
    reboot: true
  register: forest_result

- name: Wait for dc01 to come back and WinRM to respond after promotion reboot
  ansible.builtin.wait_for_connection:
    delay: 30
    timeout: 600
  when: forest_result.reboot_required | default(false)

- name: Re-gather facts after the reboot (domain membership/hostname may have changed)
  ansible.builtin.setup:
  when: forest_result.reboot_required | default(false)

- name: Create base OU structure
  microsoft.ad.ou:
    name: "{{ item.name }}"
    path: "{{ item.parent_dn }}"
    state: present
  loop: "{{ ad_base_ous }}"
